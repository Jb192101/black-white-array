name: Java Benchmarks

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run benchmarks
        run: |
          mvn clean install
          # Запускаем бенчмарки напрямую через java -jar
          java -jar target/benchmarks.jar -wi 1 -i 1 -f 1 -r 1s -w 1s || true
          # Сохраняем вывод
          echo "Benchmarks completed" >> target/jmh-output.txt

      - name: Display benchmark results
        run: |
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f target/jmh-output.txt ]; then
            cat target/jmh-output.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "No benchmark results found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: target/jmh-output.txt
          retention-days: 30