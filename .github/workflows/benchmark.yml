name: Java Benchmarks

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile with Maven
        run: mvn clean compile

      - name: Run benchmarks
        run: |
          mvn clean install
          mvn exec:java -Dexec.mainClass="org.openjdk.jmh.Main" -Dexec.args="-wi 1 -i 1 -f 1 -r 1s -w 1s -foe true" > target/jmh-output.txt 2>&1

      - name: Display benchmark results
        run: |
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f target/jmh-output.txt ]; then
            grep -A 3 "Benchmark" target/jmh-output.txt | head -50 >> $GITHUB_STEP_SUMMARY
          else
            echo "No benchmark results found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: target/jmh-output.txt
          retention-days: 30