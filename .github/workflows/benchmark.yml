name: Java Benchmarks

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run benchmarks
        run: |
          mvn clean install
          mvn exec:java -Dexec.mainClass="org.openjdk.jmh.Main" -Dexec.args="-wi 1 -i 1 -f 1 -r 1s -w 1s"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: target/jmh-output.txt